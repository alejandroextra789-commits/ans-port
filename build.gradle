plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { ans { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${project.minecraft_version}:${project.geckolib_version}")

    // Mixin annotations are required by the recovered client mixins. Forge supplies
    // the runtime; these dependencies are only for compilation and refmap generation.
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'com.eliotlash.mclib:mclib:20'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-AoutRefMapFile=' + file('build/classes/java/main/ans.refmap.json').absolutePath,
        '-AdefaultObfuscationEnv=searge',
        '-Xmaxerrs', '5000'
    ]
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'ans',
            'Specification-Vendor': 'ans-port contributors',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'ans-port contributors',
            'MixinConfigs': 'ans.client.mixins.json'
        ])
    }
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url = "file://${project.projectDir}/mcmodsrepo" } }
}
